<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1728">
  <meta name="description" content="現地作業向けのリアルタイムチェックシート">
  <title>InstaCheckList</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">✓</span><div><h1>InstaCheckList</h1><small>SCAN · CHECK · COMPLETE</small></div></div>
    <button id="connectBtn" class="connect">Spreadsheetに接続</button>
  </header>
  <main>
    <section id="setup" class="setup card">
      <div><span class="eyebrow">SETUP</span><h2>チェックシートを選択</h2><p>Googleアカウントで接続し、作業用Spreadsheetを選択してください。</p></div>
      <button id="selectSheetBtn" class="primary">Google Driveから選択</button>
      <p id="setupStatus" class="status" aria-live="polite">未接続</p>
    </section>

    <section id="scanner" class="scanner card" hidden>
      <div class="section-head"><div><span class="eyebrow">DEVICE</span><h2>機器を読み取る</h2></div><button id="changeSheetBtn" class="text-btn">シート変更</button></div>
      <div class="camera-wrap"><video id="video" playsinline muted></video><div class="scan-line"></div><p id="cameraMessage">カメラを起動しています…</p></div>
      <div class="serial-entry"><input id="serialInput" autocomplete="off" placeholder="シリアル番号を入力"><button id="openDeviceBtn" class="primary">開く</button></div>
      <button id="cameraToggleBtn" class="text-btn wide">カメラ ON / OFF</button>
    </section>

    <section id="workspace" hidden>
      <div class="device-bar"><div><small>SERIAL NUMBER</small><strong id="serialLabel"></strong></div><button id="newScanBtn">別の機器</button></div>
      <div id="syncBar" class="sync" data-kind="ready">準備完了</div>
      <div id="progress" class="progress"><span></span></div>
      <div id="checklist" class="checklist"></div>
      <p id="emptyItems" class="empty" hidden>有効なチェック項目がありません。</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="vendor/zxing.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="app.js"></script>
</body>
</html>
